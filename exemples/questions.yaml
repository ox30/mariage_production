# ---------------------------------------------------------------------------
# Banc d'essai « Terre du Milieu » — configuration
#
# Tout ce qui se corrige sans redéployer de code vit ici.
# Modifier ce fichier puis redémarrer le service suffit.
#
# Champs reconnus par le code :
#   type       boutons | texte_court | texte_long
#   role       lecture humaine seulement
#   usage      portrait (défaut) | indice | revelation | chapitre
#              revelation et chapitre ne sont JAMAIS transmis au modèle
#   condition  question posée seulement si {cle} vaut {valeur}
#   prealable  sélecteur affiché au-dessus d'une zone de texte
# ---------------------------------------------------------------------------

lieux:
  # libelle    : le nom de la région, affiché et porté par la carte
  # locution   : la forme grammaticale correcte — « en Comté », « à Minas Tirith »
  # ombre      : le lieu voisin où se tiennent les créatures ; un orque ne se
  #              promène pas dans Minas Tirith, il rôde à sa porte
  - code: lieu_01
    libelle: La Comté
    locution: en Comté
    ombre: les Hauts des Galgals, à ses lisières
  - code: lieu_02
    libelle: Fondcombe
    locution: à Fondcombe
    ombre: les gorges de la Bruinen, en contrebas
  - code: lieu_03
    libelle: Les Mines de la Moria
    locution: dans les Mines de la Moria
    ombre: les profondeurs de la Moria
  - code: lieu_04
    libelle: La Lothlórien
    locution: en Lothlórien
    ombre: les marges obscures de Fangorn
  - code: lieu_05
    libelle: Isengard
    locution: à Isengard
    ombre: les fosses d'Isengard
  - code: lieu_06
    libelle: Edoras
    locution: à Edoras
    ombre: les campements du Gué de l'Isen
  - code: lieu_07
    libelle: Minas Tirith
    locution: à Minas Tirith
    ombre: les ruines d'Osgiliath, de l'autre rive
  - code: lieu_08
    libelle: La Forêt Noire
    locution: en Forêt Noire
    ombre: les toiles du sud de la Forêt Noire
  - code: lieu_09
    libelle: Les Havres Gris
    locution: aux Havres Gris
    ombre: les récifs battus au nord des Havres
  - code: lieu_10
    libelle: Cirith Ungol
    locution: à Cirith Ungol
    ombre: la tour de Cirith Ungol

# Longueur du portrait, en mots. Six réponses tiennent en 150 mots ; douze
# ancres demandent plus de place. Au-delà de 250, la lecture de cent chroniques
# devient un travail : c'est la limite de lecture, pas la limite du modèle.
mots_max:
  sans_complement: 150
  avec_complement: 220

# Six peuples de la Lumière, quatre peuples humains de l'Ombre, six créatures.
# Le peuple est toujours déduit, jamais choisi. Les créatures ne s'ouvrent que
# sur consentement explicite de l'invité (question `monstre`).
peuples:
  - hobbit
  - elfe
  - nain
  - homme
  - dunedain
  - ent
  - Dunlending
  - Numenoreen noir
  - Corsaire d'Umbar
  - Oriental
  - Haradrim
  - Variag de Khand
  - troll
  - spectre
  - Uruk-hai
  - gobelin
  - cavalier de warg
  - orque

# --- Premier étage : six questions, plus deux si l'Ombre est choisie --------

obligatoires:
  - cle: metier
    role: ancre forte
    type: texte_court
    question: Quel est ton métier, ou ce qui t'occupe tes journées ?
    exemple: opérateur du trafic, infirmière, retraité jardinier…
    limite: 60

  - cle: attachement
    role: signal caché du peuple
    type: boutons
    question: À quoi ne renoncerais-tu jamais ?
    options:
      - Une bonne table entre amis
      - La musique et les belles choses
      - Un travail fait proprement
      - Ma famille
      - La route et le grand air
      - La nature

  - cle: defaut
    role: ancre devinable
    type: boutons
    question: Ton défaut, celui que tu avoues volontiers ?
    options:
      - Toujours en retard
      - Je parle trop
      - Je ne sais pas dire non
      - Têtu comme une mule
      - Je veux tout contrôler
      - Je remets tout à demain
      # +2 le 25 août (EX-QUE-17) : à six options et cent invités,
      # dix-sept personnes partagent le même défaut.
      - Je m'inquiète pour tout
      - Je dis ce que je pense, trop vite
    autre:
      libelle: Autre chose…
      exemple: en quelques mots, à la première personne
      limite: 60

  - cle: objet
    role: ancre forte (artefact)
    type: texte_court
    question: Un objet dont tu ne te sépares jamais ?
    exemple: mon carnet, ma montre de grand-père, mon sécateur…
    limite: 60

  - cle: allegeance
    # Ce que le questionnaire réduit des mariés fait de cette question
    # (EX-MAR-02, EX-MAR-03). Marqué ICI et non dans le code :
    # `questions.yaml` est la référence éditoriale (EX-QUE-12), elle se
    # corrige sans redéploiement, et une question ajoutée demain se marque
    # là où elle s'écrit.
    sur_les_maries: La Lumière
    role: registre du portrait
    type: boutons
    question: Ce soir, tu sers la Lumière ou l'Ombre ?
    options:
      - La Lumière
      - L'Ombre

  - cle: monstre
    role: consentement explicite au registre monstrueux
    type: boutons
    condition:
      cle: allegeance
      valeur: L'Ombre
    question: Jusqu'où ?
    exemple: un seigneur reste un seigneur. Un monstre est un monstre.
    options:
      - Un seigneur redouté, mais un seigneur
      - Un monstre, et j'assume

  - cle: destin
    role: drapeau pour l'écriture des chapitres, jamais transmis au modèle
    usage: chapitre
    type: boutons
    condition:
      cle: allegeance
      valeur: L'Ombre
    question: Acceptes-tu de périr dans d'atroces souffrances ?
    exemple: pas ce soir. Plus tard, dans le récit que recevront les mariés.
    options:
      - Oui, et que ce soit spectaculaire
      - Non, je compte bien survivre

  - cle: souvenir
    # Ce que le questionnaire réduit des mariés fait de cette question
    # (EX-MAR-02, EX-MAR-03). Marqué ICI et non dans le code :
    # `questions.yaml` est la référence éditoriale (EX-QUE-12), elle se
    # corrige sans redéploiement, et une question ajoutée demain se marque
    # là où elle s'écrit.
    sur_les_maries: retiree
    role: ancre la plus forte + message aux mariés
    type: texte_long
    prealable:
      cle: souvenir_avec
      intitule_modele: "Personnes présentes DANS CE SOUVENIR (et rien d'autre)"
      question: Ce souvenir, c'est avec…
      options:
        - "{mariee}"
        - "{marie}"
        - Les deux
    question: Un souvenir, une image qui vous revient ?
    exemple: ce qui te vient, même court. C'est ce qu'ils liront.
    limite: 300

  - cle: souhait
    # Ce que le questionnaire réduit des mariés fait de cette question
    # (EX-MAR-02, EX-MAR-03). Marqué ICI et non dans le code :
    # `questions.yaml` est la référence éditoriale (EX-QUE-12), elle se
    # corrige sans redéploiement, et une question ajoutée demain se marque
    # là où elle s'écrit.
    sur_les_maries: retiree
    role: montré tel quel aux mariés à la révélation ; jamais transmis au modèle
    usage: revelation
    type: texte_long
    question: Que souhaites-tu à {mariee} et {marie} ?
    exemple: une phrase suffit
    limite: 300

# --- Second étage : six questions complémentaires ---------------------------

bonus:
  - cle: lien
    # Ce que le questionnaire réduit des mariés fait de cette question
    # (EX-MAR-02, EX-MAR-03). Marqué ICI et non dans le code :
    # `questions.yaml` est la référence éditoriale (EX-QUE-12), elle se
    # corrige sans redéploiement, et une question ajoutée demain se marque
    # là où elle s'écrit.
    sur_les_maries: retiree
    role: premier palier d'indice
    type: boutons
    question: Comment connais-tu les mariés ?
    options:
      - "Famille de {mariee}"
      - "Famille de {marie}"
      - Ami d'enfance
      - Collègue
      - Voisinage
    # « Autrement » a été RETIRÉE des options au profit du champ libre : elle
    # était un cul-de-sac. `lien` est le premier palier d'indice, et celui qui
    # la choisissait livrait exactement zéro information aux mariés. Pas de
    # nouvelle option ici — la question n'est pas un trait de caractère, elle
    # doit rester précise.
    autre:
      libelle: Autrement…
      exemple: en quelques mots
      limite: 60

  - cle: role_groupe
    role: fonction dans le chapitre
    type: boutons
    question: Dans un groupe, tu es plutôt celui ou celle qui…
    options:
      - Organise tout
      - Fait rire
      - Réconforte
      - Calme le jeu
      - Observe en silence
      - Raconte les histoires
      - Rend service sans qu'on demande
    autre:
      libelle: Autre chose…
      exemple: en quelques mots, à la première personne
      limite: 60

  - cle: colere
    role: conflit du chapitre
    type: boutons
    question: Qu'est-ce qui te met vraiment en colère ?
    options:
      - L'injustice
      - Le travail bâclé
      - Le mensonge
      - Qu'on me presse
      - Le bruit et la foule
      - Qu'on touche à mes proches
      - Qu'on me prenne de haut
      - La lâcheté
    autre:
      libelle: Autre chose…
      exemple: en quelques mots, à la première personne
      limite: 60

  - cle: talent
    role: ancre forte
    type: texte_court
    question: Un talent que personne ne soupçonne chez toi ?
    exemple: je siffle faux mais fort, je répare n'importe quoi…
    limite: 80

  - cle: phrase
    role: ancre très forte + voix du personnage
    type: texte_court
    question: Une phrase que tu répètes tout le temps ?
    exemple: celle dont tes proches se moquent
    limite: 80


# Motifs de reprise proposés à l'invité qui demande une réécriture. Liste
# FERMÉE : aucune saisie libre n'est transmise au modèle, sinon un invité
# pourrait choisir son peuple ou son lieu et ruiner l'équilibrage.
motifs_reprise:
  - cle: souvenir
    libelle: Mon souvenir a été mal compris
    consigne: >
      La reprise précédente a mal interprété le souvenir. Relis-le avec soin :
      qui parle, qui est tutoyé, à qui arrive quoi. Le personnage est l'auteur
      du souvenir, pas la personne qu'il y désigne.
  - cle: genre
    libelle: Ce n'est pas le bon genre
    consigne: >
      Le genre du personnage était faux. Reprends-le en respectant strictement
      le genre indiqué, nom fictif compris.
  - cle: ton
    libelle: Le ton ne me ressemble pas
    consigne: >
      Change de registre : garde les mêmes ancres, mais un autre angle
      d'attaque, un autre rythme, une autre humeur.
  - cle: invente
    libelle: Trop de choses inventées
    consigne: >
      Serre-toi aux réponses données. Réduis les détails décoratifs que rien
      dans les réponses ne justifie, et fais ressortir les ancres réelles.

# --- Contrat de style transmis au modèle ------------------------------------

contrat: |
  Tu écris un portrait de personnage situé en Terre du Milieu, pour un jeu de
  devinettes offert à un couple de mariés. Les invités ont répondu à un
  questionnaire sur eux-mêmes. Ta tâche est de transposer chaque personne en
  personnage, sans la rendre méconnaissable.

  RÈGLES ABSOLUES
  1. Transposer le décor, conserver le détail concret. Un opérateur du trafic
     devient celui qui règle le passage des convois sur les routes du royaume,
     pas « un noble voyageur ». Le métier, l'objet et le souvenir doivent
     rester reconnaissables sous le costume.
  2. Le portrait contient au moins TROIS ancres identifiables, dont au moins
     une forte (le métier ou l'objet).
  3. N'écris JAMAIS un nom propre réel. Aucun prénom, aucun nom de famille,
     aucun nom de commune du monde réel. Le personnage n'a que son nom fictif.
     Cela vaut aussi pour les prénoms des mariés : ils te sont donnés pour
     comprendre les réponses, jamais pour être écrits. Dans le texte, les
     mariés sont « les deux fiancés », « celle qu'on célèbre », « le futur
     époux » — jamais nommés.
  4. Aucun trait physique du monde réel : ni taille, ni poids, ni cheveux, ni
     âge. Les attributs du peuple, en revanche, t'appartiennent.
  5. L'allégeance PEUT être nommée, et elle mérite de l'être quand elle
     détonne : un homme du Rohan au service de l'Ombre, une contradiction
     pareille est un ressort, pas une gêne — exploite-la.
     En revanche elle ne se pose jamais à plat, et surtout pas en fin de
     portrait. Sont interdites les chutes du type « ce soir, il sert la
     Lumière » ou « il sert l'Ombre, avec la rigueur d'un forgeron » : une
     étiquette collée après coup n'apprend rien. Fais-la vivre dans l'action —
     ce qu'il fréquente, ce qu'il tait, à qui il rend des comptes.
  6. Le souvenir avec les mariés doit être transposé, pas recopié : il devient
     une scène vécue en Terre du Milieu.
     **Attention à la deuxième personne.** Les invités écrivent souvent leur
     souvenir en s'adressant directement aux mariés : « je t'ai tenue dans mes
     bras », « tu es tombé en te cassant le poignet », « étant ta grand-maman ».
     Dans ces phrases, « tu », « toi », « ta » et « vous » désignent TOUJOURS
     la ou les personnes indiquées comme présentes dans le souvenir — jamais
     l'auteur. Celui qui écrit est le personnage ; celui qu'il tutoie est un
     fiancé. Confondre les deux produit un portrait faux.
     **Deux informations distinctes ne doivent jamais être confondues** : les
     personnes présentes dans le souvenir, et le lien de parenté ou d'amitié.
     Quelqu'un peut partager un souvenir avec les deux fiancés tout en n'étant
     apparenté qu'à un seul. Une scène vécue à deux ne prouve rien sur la
     parenté : n'étends jamais un lien de l'un à l'autre.
  7. Le lien avec les mariés a sa place dans le portrait, mais transposé.
     N'emploie aucun terme du monde réel — ni beau-frère, ni belle-sœur, ni
     cousin, ni collègue, ni voisin : ces mots-là appartiennent à l'indice.
     Dis la même chose avec les mots de la Terre du Milieu : « celle qui devint
     sœur de son épouse », « ceux de sa parenté », « ceux avec qui il partage
     l'établi ».
     **N'étends jamais un lien au-delà de ce qui est déclaré.** Deux réponses
     distinctes ne doivent pas être fusionnées : « avec qui » qualifie la scène
     du souvenir, « comment connais-tu les mariés » qualifie le lien. Quelqu'un
     qui déclare un souvenir avec les deux mais une parenté avec un seul n'est
     apparenté qu'à celui-là. Dans le doute, tais le lien plutôt que de
     l'inventer : une parenté fausse se remarque immédiatement dans une
     famille.
  8. **« Ce souvenir, c'est avec… » désigne qui était présent dans la scène, et
     rien d'autre.** Ce n'est PAS l'étendue du lien de parenté. Quelqu'un peut
     avoir vécu un souvenir avec les deux fiancés tout en n'étant apparenté
     qu'à un seul d'entre eux. N'étends jamais la parenté au-delà de ce
     qu'indique « comment connais-tu les mariés » : si la réponse ne nomme
     qu'un des deux, le personnage n'est de la parenté que de celui-là, même
     si la scène réunit tout le monde.
  9. Utilise toutes les réponses données, mais jamais dans le même ordre.
     Chaque réponse est une prise pour deviner : en écarter une, c'est retirer
     une chance aux mariés.
     Ne commence ni ne termine jamais deux portraits de la même façon. N'ouvre
     pas sur la convocation ni sur le nom du lieu — « Convoqué à… » est
     l'ouverture la plus attendue, donc la plus lassante à la dixième lecture.
     Entre par le personnage : un geste en cours, une habitude, une réputation
     qui court, une chose qu'on lui reproche. Le nom du personnage n'a pas à
     figurer dans la première phrase. Ne finis pas sur une formule de vœux.
  10. Français, à la troisième personne, ton de chronique.
     150 mots maximum, et cette limite est ferme. Un portrait de 200 mots n'est
     pas plus riche, il est plus long : à la dixième lecture d'affilée, c'est
     la concision qui tient. Coupe les adjectifs avant de couper les ancres.

  LE PEUPLE
  Il se déduit de « à quoi ne renoncerais-tu jamais », croisée avec
  l'allégeance. Le champ « peuple » reprend exactement l'un des noms ci-dessous.

  ALLÉGEANCE À LA LUMIÈRE — correspondance stricte :
    une bonne table entre amis      → hobbit
    la musique et les belles choses → elfe
    un travail fait proprement      → nain
    ma famille                      → homme
    la route et le grand air        → dunedain
    la nature                       → ent

  ALLÉGEANCE À L'OMBRE, « un seigneur redouté » — correspondance stricte, parmi
  les peuples humains qui servent l'Ombre. Ce sont des hommes, pas des
  créatures : dignes, cultivés, redoutables. Le métier, l'objet et le souvenir
  survivent intacts.
    une bonne table entre amis      → Dunlending
    la musique et les belles choses → Numenoreen noir
    un travail fait proprement      → Corsaire d'Umbar
    ma famille                      → Oriental
    la route et le grand air        → Haradrim
    la nature                       → Variag de Khand

  ALLÉGEANCE À L'OMBRE, « un monstre, et j'assume » — la personne l'a
  explicitement demandé, ne te retiens pas :
    une bonne table entre amis      → troll
    la musique et les belles choses → spectre
    un travail fait proprement      → Uruk-hai
    ma famille                      → gobelin
    la route et le grand air        → cavalier de warg
    la nature                       → orque

  Le monstre reste grandiose ou comique, jamais humiliant : c'est un cadeau de
  mariage, et la personne a choisi son camp en connaissance de cause. Ses
  ancres restent reconnaissables sous la peau verte — un troll tient l'auberge,
  un Uruk-hai forge, un orque abat les arbres que d'autres plantent.

  LE GENRE
  Si un genre est indiqué avec les réponses, il s'impose : nom fictif, pronoms,
  participes et adjectifs s'y accordent d'un bout à l'autre. Un prénom réel ne
  permet pas de deviner le genre — Jean-Pascal, Dominique, Camille — et se
  tromper produit un portrait que la personne ne reconnaîtra pas comme le sien.
  Si aucun genre n'est indiqué, choisis-en un et tiens-le sans jamais hésiter
  au fil du texte.

  LE NOM FICTIF
  Inventé, prononçable à voix haute, cohérent avec le peuple, et qui ne
  ressemble pas au nom réel de la personne. Deux mots maximum.

  L'INDICE
  Une seule phrase, destinée aux mariés s'ils sont bloqués. Elle oriente sans
  livrer la réponse : elle désigne le domaine de la vie de la personne, jamais
  son identité. C'est ici — et nulle part ailleurs — que le lien avec les
  mariés peut être évoqué, s'il est connu.

  SORTIE
  Uniquement un objet JSON, sans texte autour, sans balises de code :
  {"nom_fictif": "...", "peuple": "...", "portrait": "...", "indice": "..."}
